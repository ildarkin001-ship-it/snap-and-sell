<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Сфоткай — Продай</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow-x: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const PRESETS = [
      {
        id: 'delonghi',
        name: 'Кофемашина DeLonghi Magnifica S',
        code: 'ECAM 22.110.B',
        category: 'Бытовая техника / Кофемашины',
        image: 'https://images.unsplash.com/photo-1517668808822-9ebb02f2a0e6?auto=format&fit=crop&w=900&q=80',
        specs: ['Давление помпы: 15 бар', 'Мощность: 1450 Вт', 'Встроенная кофемолка (13 степеней)', 'Габариты: 23.8 × 43 × 35.1 см'],
        prices: { fast: 16500, optimal: 19900, max: 23500 }
      },
      {
        id: 'ballu',
        name: 'Тепловая завеса Ballu BHC-CE-3L',
        code: 'BHC-CE-3L (3 кВт)',
        category: 'Климатическое оборудование',
        image: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=900&q=80',
        specs: ['Мощность обогрева: 3 / 1.5 кВт', 'Производительность: 300 м³/ч', 'Стич-элемент, быстрый нагрев', 'Длина корпуса: 58.5 см'],
        prices: { fast: 3200, optimal: 3900, max: 4600 }
      },
      {
        id: 'iphone',
        name: 'Смартфон Apple iPhone 13 128 ГБ',
        code: 'A2633 (Midnight)',
        category: 'Электроника / Телефоны',
        image: 'https://images.unsplash.com/photo-1632661674596-df8be070a5c5?auto=format&fit=crop&w=900&q=80',
        specs: ['Память: 128 ГБ, цвет «Тёмная ночь»', 'Экран: 6.1" Super Retina XDR OLED', 'Face ID, NFC, 2 SIM (nano + eSIM)', 'Комплект: коробка и кабель'],
        prices: { fast: 34500, optimal: 38900, max: 42000 }
      }
    ];

    function App() {
      const [step, setStep] = useState(1);
      const [selectedPreset, setSelectedPreset] = useState(PRESETS[0]);
      const [customImage, setCustomImage] = useState(null);
      const [itemName, setItemName] = useState(PRESETS[0].name);
      const [specs, setSpecs] = useState(PRESETS[0].specs);
      const [editingSpecs, setEditingSpecs] = useState(false);
      const [newSpec, setNewSpec] = useState('');

      // Шаг 2: Ретушь
      const [sliderPos, setSliderPos] = useState(65);
      const [daylight, setDaylight] = useState(true);
      const [blurBg, setBlurBg] = useState(true);
      const [sharpLabel, setSharpLabel] = useState(true);

      // Шаг 3: Голос и состояние
      const [isRecording, setIsRecording] = useState(false);
      const [voiceNotes, setVoiceNotes] = useState('В отличном рабочем состоянии, бережная эксплуатация дома, всё проверено.');
      const [tone, setTone] = useState('honest');

      // Шаг 4: Цена и результат
      const [priceTier, setPriceTier] = useState('optimal');
      const [credits, setCredits] = useState(2);
      const [showPayModal, setShowPayModal] = useState(false);
      const [copied, setCopied] = useState(false);

      const fileInputRef = useRef(null);

      useEffect(() => {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }
      }, []);

      const haptic = () => {
        if (window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
        }
      };

      const selectPreset = (preset) => {
        haptic();
        setSelectedPreset(preset);
        setCustomImage(null);
        setItemName(preset.name);
        setSpecs(preset.specs);
      };

      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setCustomImage(ev.target.result);
          setItemName('Товар с вашего фото (готов к ИИ-распознаванию)');
        };
        reader.readAsDataURL(file);
      };

      const toggleVoiceSim = () => {
        haptic();
        if (isRecording) {
          setIsRecording(false);
          return;
        }
        setIsRecording(true);
        setTimeout(() => {
          setVoiceNotes('Покупал полтора года назад, работает без нареканий, недавно обслужен. Есть мелкая потертость сбоку, на работу не влияет. Реальному покупателю небольшой торг при осмотре.');
          setIsRecording(false);
        }, 2000);
      };

      const addQuickChip = (text) => {
        haptic();
        setVoiceNotes((prev) => (prev ? `${prev} ${text}` : text));
      };

      const currentPrice = selectedPreset.prices[priceTier];
      const activeImage = customImage || selectedPreset.image;

      const generateAdText = () => {
        const specsList = specs.map((s) => `• ${s}`).join('\n');
        const intro =
          tone === 'honest'
            ? `Продаю ${itemName}. Вещь домашнего хранения, полностью исправна и готова к проверке.`
            : tone === 'fast'
            ? `Срочная продажа! ${itemName} по цене ниже рынка из-за переезда.`
            : `В продаже ${itemName} (модель ${selectedPreset.code}). Технически в полном порядке.`;

        return `${intro}\n\nСостояние и детали:\n${voiceNotes}\n\nХарактеристики:\n${specsList}\n\nЦена: ${currentPrice.toLocaleString('ru-RU')} ₽. Пишите в чат или звоните — отвечаю быстро!`;
      };

      const copyAd = () => {
        haptic();
        navigator.clipboard.writeText(generateAdText());
        setCopied(true);
        setTimeout(() => setCopied(false), 2500);
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col justify-between pb-24">
          {/* Шапка */}
          <header className="sticky top-0 z-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 px-4 py-3 flex items-center justify-between">
            <div>
              <div className="flex items-center gap-2">
                <span className="text-lg font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
                  Сфоткай — Продай
                </span>
                <span className="text-[11px] bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">AI Упаковщик</span>
              </div>
              <p className="text-xs text-slate-400">Объявление за 30 секунд</p>
            </div>
            <button
              onClick={() => { haptic(); setShowPayModal(true); }}
              className="bg-emerald-500/15 border border-emerald-500/40 text-emerald-300 text-xs font-medium px-3 py-1.5 rounded-full"
            >
              🎁 {credits} бесплатно
            </button>
          </header>

          {/* Навигация по 4 шагам */}
          <div className="px-4 pt-3">
            <div className="grid grid-cols-4 gap-1.5 bg-slate-800/70 p-1 rounded-xl">
              {[
                { n: 1, label: '1. Фото' },
                { n: 2, label: '2. Свет' },
                { n: 3, label: '3. Голос' },
                { n: 4, label: '4. Цена' }
              ].map((s) => (
                <button
                  key={s.n}
                  onClick={() => { haptic(); setStep(s.n); }}
                  className={`py-2 text-xs font-semibold rounded-lg transition ${
                    step === s.n ? 'bg-emerald-500 text-slate-950 shadow' : 'text-slate-400'
                  }`}
                >
                  {s.label}
                </button>
              ))}
            </div>
          </div>

          {/* Контент шага */}
          <main className="p-4 space-y-4 flex-1">
            {step === 1 && (
              <div className="space-y-4">
                <div className="bg-slate-800/60 border border-slate-700/70 rounded-2xl p-3">
                  <div className="relative h-52 rounded-xl overflow-hidden bg-slate-900 mb-3">
                    <img src={activeImage} alt={itemName} className="w-full h-full object-cover" />
                    <div className="absolute top-2 left-2 bg-slate-950/80 backdrop-blur text-emerald-400 text-xs px-2.5 py-1 rounded-full border border-emerald-500/30">
                      ✓ Модель распознана по кадру
                    </div>
                  </div>

                  <input
                    ref={fileInputRef}
                    type="file"
                    accept="image/*"
                    onChange={handlePhotoUpload}
                    className="hidden"
                  />
                  <button
                    onClick={() => fileInputRef.current?.click()}
                    className="w-full py-2.5 bg-slate-700 hover:bg-slate-600 text-sm font-medium rounded-xl mb-3 transition"
                  >
                    📷 Загрузить своё фото или шильдик
                  </button>

                  <p className="text-xs text-slate-400 mb-2">Или протестируйте на готовых примерах:</p>
                  <div className="grid grid-cols-3 gap-2">
                    {PRESETS.map((p) => (
                      <button
                        key={p.id}
                        onClick={() => selectPreset(p)}
                        className={`p-2 rounded-xl border text-left text-xs transition ${
                          selectedPreset.id === p.id && !customImage
                            ? 'border-emerald-500 bg-emerald-500/10 text-white'
                            : 'border-slate-700 bg-slate-900/50 text-slate-400'
                        }`}
                      >
                        <div className="font-semibold truncate">{p.name.split(' ')[1]}</div>
                        <div className="text-[10px] opacity-75 truncate">{p.code}</div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* Характеристики */}
                <div className="bg-slate-800/60 border border-slate-700/70 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs uppercase tracking-wider text-slate-400 font-semibold">Найденные характеристики</span>
                    <button
                      onClick={() => setEditingSpecs(!editingSpecs)}
                      className="text-xs text-emerald-400 font-medium"
                    >
                      {editingSpecs ? 'Готово' : 'Изменить'}
                    </button>
                  </div>
                  <input
                    value={itemName}
                    onChange={(e) => setItemName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm font-semibold"
                  />
                  <ul className="space-y-1.5 text-xs text-slate-300">
                    {specs.map((s, idx) => (
                      <li key={idx} className="flex items-center justify-between bg-slate-900/60 px-3 py-1.5 rounded-lg">
                        <span>• {s}</span>
                        {editingSpecs && (
                          <button
                            onClick={() => setSpecs(specs.filter((_, i) => i !== idx))}
                            className="text-rose-400 ml-2"
                          >
                            ✕
                          </button>
                        )}
                      </li>
                    ))}
                  </ul>
                  {editingSpecs && (
                    <div className="flex gap-2 pt-1">
                      <input
                        value={newSpec}
                        onChange={(e) => setNewSpec(e.target.value)}
                        placeholder="Добавить параметр..."
                        className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs"
                      />
                      <button
                        onClick={() => {
                          if (newSpec.trim()) {
                            setSpecs([...specs, newSpec.trim()]);
                            setNewSpec('');
                          }
                        }}
                        className="bg-emerald-500 text-slate-950 px-3 py-1.5 rounded-lg text-xs font-bold"
                      >
                        +
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {step === 2 && (
              <div className="space-y-4">
                <div className="bg-slate-800/60 border border-slate-700/70 rounded-2xl p-3 space-y-3">
                  <div className="flex justify-between items-center text-xs text-slate-400">
                    <span>Оригинал (тусклый свет)</span>
                    <span className="text-emerald-400 font-medium">Ретушь «Живое фото»</span>
                  </div>

                  {/* Слайдер До/После */}
                  <div className="relative h-60 rounded-xl overflow-hidden select-none bg-slate-950">
                    {/* После (обработанное) */}
                    <img
                      src={activeImage}
                      alt="После"
                      className="w-full h-full object-cover"
                      style={{
                        filter: `${daylight ? 'brightness(1.14) contrast(1.08) saturate(1.12)' : 'none'} ${
                          sharpLabel ? 'drop-shadow(0 0 1px rgba(255,255,255,0.4))' : ''
                        }`
                      }}
                    />
                    {/* До (тусклый исходник слева) */}
                    <div
                      className="absolute inset-y-0 left-0 overflow-hidden border-r-2 border-emerald-400"
                      style={{ width: `${100 - sliderPos}%` }}
                    >
                      <img
                        src={activeImage}
                        alt="До"
                        className="h-full object-cover max-w-none"
                        style={{
                          width: '380px',
                          filter: 'brightness(0.75) sepia(0.22) contrast(0.9)'
                        }}
                      />
                    </div>
                  </div>

                  <input
                    type="range"
                    min="10"
                    max="90"
                    value={sliderPos}
                    onChange={(e) => setSliderPos(Number(e.target.value))}
                    className="w-full accent-emerald-400"
                  />

                  <div className="space-y-2 pt-1">
                    {[
                      { label: '☀️ Выровнять комнатный свет', state: daylight, set: setDaylight },
                      { label: '🛋 Мягко размыть бытовой фон', state: blurBg, set: setBlurBg },
                      { label: '🔍 Повысить чёткость деталей', state: sharpLabel, set: setSharpLabel }
                    ].map((t, i) => (
                      <label key={i} className="flex items-center justify-between bg-slate-900/70 px-3 py-2.5 rounded-xl text-xs cursor-pointer">
                        <span>{t.label}</span>
                        <input
                          type="checkbox"
                          checked={t.state}
                          onChange={() => { haptic(); t.set(!t.state); }}
                          className="accent-emerald-400 w-4 h-4"
                        />
                      </label>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {step === 3 && (
              <div className="space-y-4">
                <div className="bg-slate-800/60 border border-slate-700/70 rounded-2xl p-4 space-y-3 text-center">
                  <p className="text-xs text-slate-300">
                    Нажмите микрофон и за 10 секунд расскажите своими словами про состояние, комплектацию и торг:
                  </p>
                  <button
                    onClick={toggleVoiceSim}
                    className={`mx-auto w-20 h-20 rounded-full flex items-center justify-center text-2xl transition shadow-lg ${
                      isRecording
                        ? 'bg-rose-500 animate-pulse text-white'
                        : 'bg-emerald-500 text-slate-950 hover:bg-emerald-400'
                    }`}
                  >
                    🎙️
                  </button>
                  <p className="text-[11px] text-slate-400">
                    {isRecording ? 'Слушаю и убираю слова-паразиты...' : 'Нажмите для голосовой записи'}
                  </p>

                  <div className="flex flex-wrap gap-1.5 justify-center pt-1">
                    {['Состояние нового', 'Заменена деталь на оригинал', 'Коробка и чек в наличии', 'Торг при осмотре', 'Могу отправить доставкой'].map((chip) => (
                      <button
                        key={chip}
                        onClick={() => addQuickChip(chip + '.')}
                        className="text-[11px] bg-slate-900 hover:bg-slate-700 border border-slate-700 px-2.5 py-1 rounded-full text-slate-300"
                      >
                        + {chip}
                      </button>
                    ))}
                  </div>
                </div>

                <div className="bg-slate-800/60 border border-slate-700/70 rounded-2xl p-4 space-y-3">
                  <label className="text-xs text-slate-400 font-semibold block">Распознанные детали состояния:</label>
                  <textarea
                    rows="3"
                    value={voiceNotes}
                    onChange={(e) => setVoiceNotes(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200"
                  />

                  <div className="grid grid-cols-3 gap-1.5 pt-1">
                    {[
                      { id: 'honest', name: 'Честный частник' },
                      { id: 'fast', name: 'Быстрая продажа' },
                      { id: 'tech', name: 'Технический' }
                    ].map((t) => (
                      <button
                        key={t.id}
                        onClick={() => { haptic(); setTone(t.id); }}
                        className={`py-2 px-2 rounded-lg text-[11px] font-medium border ${
                          tone === t.id
                            ? 'border-emerald-500 bg-emerald-500/15 text-emerald-300'
                            : 'border-slate-700 bg-slate-900 text-slate-400'
                        }`}
                      >
                        {t.name}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {step === 4 && (
              <div className="space-y-4">
                <div className="grid grid-cols-3 gap-2">
                  {[
                    { id: 'fast', title: 'За 24 часа', price: selectedPreset.prices.fast, desc: 'Быстрые деньги' },
                    { id: 'optimal', title: 'Оптимально', price: selectedPreset.prices.optimal, desc: 'За 3–7 дней' },
                    { id: 'max', title: 'Максимум', price: selectedPreset.prices.max, desc: 'Без спешки' }
                  ].map((tier) => (
                    <button
                      key={tier.id}
                      onClick={() => { haptic(); setPriceTier(tier.id); }}
                      className={`p-3 rounded-2xl border text-left transition ${
                        priceTier === tier.id
                          ? 'border-emerald-400 bg-emerald-500/15'
                          : 'border-slate-700 bg-slate-800/60'
                      }`}
                    >
                      <div className="text-[10px] text-slate-400">{tier.title}</div>
                      <div className="text-sm font-bold text-white mt-0.5">
                        {tier.price.toLocaleString('ru-RU')} ₽
                      </div>
                      <div className="text-[10px] text-emerald-400 mt-1">{tier.desc}</div>
                    </button>
                  ))}
                </div>

                <div className="bg-slate-800/60 border border-slate-700/70 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center justify-between">
                    <span className="text-xs font-semibold text-slate-300">Готовый текст объявления</span>
                    <span className="text-[11px] text-emerald-400">{selectedPreset.category}</span>
                  </div>
                  <pre className="whitespace-pre-wrap bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 font-sans leading-relaxed">
                    {generateAdText()}
                  </pre>
                  <button
                    onClick={copyAd}
                    className="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-sm transition"
                  >
                    {copied ? '✓ Текст скопирован в буфер!' : '📋 Скопировать готовое объявление'}
                  </button>
                </div>
              </div>
            )}
          </main>

          {/* Нижняя панель переключения шагов */}
          <footer className="fixed bottom-0 inset-x-0 bg-slate-900/95 backdrop-blur border-t border-slate-800 p-3">
            <div className="max-w-md mx-auto flex gap-2">
              {step > 1 && (
                <button
                  onClick={() => { haptic(); setStep(step - 1); }}
                  className="px-4 py-3 bg-slate-800 text-slate-300 rounded-xl text-sm font-medium"
                >
                  Назад
                </button>
              )}
              {step < 4 ? (
                <button
                  onClick={() => { haptic(); setStep(step + 1); }}
                  className="flex-1 py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl text-sm"
                >
                  Далее → Шаг {step + 1}
                </button>
              ) : (
                <button
                  onClick={() => { haptic(); setStep(1); }}
                  className="flex-1 py-3 bg-slate-800 text-emerald-400 font-semibold rounded-xl text-sm"
                >
                  + Упаковать ещё один товар
                </button>
              )}
            </div>
          </footer>

          {/* Модальное окно тарифов */}
          {showPayModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl p-5 w-full max-w-sm space-y-4">
                <div className="flex justify-between items-center">
                  <h3 className="font-bold text-base">Пакеты без подписок</h3>
                  <button onClick={() => setShowPayModal(false)} className="text-slate-400 text-lg">✕</button>
                </div>
                <p className="text-xs text-slate-400">
                  Никаких автосписаний. Оплачивайте разово только тогда, когда нужно быстро распродать вещи:
                </p>
                <div className="space-y-2">
                  {[
                    { count: '5 объявлений', price: '149 ₽', tag: 'Разобрать балкон' },
                    { count: '15 объявлений', price: '290 ₽', tag: 'Хит • Выгода 35%' },
                    { count: '30 объявлений', price: '490 ₽', tag: 'Для активных продаж' }
                  ].map((pkg, i) => (
                    <button
                      key={i}
                      onClick={() => {
                        haptic();
                        setCredits(credits + parseInt(pkg.count));
                        setShowPayModal(false);
                      }}
                      className="w-full flex items-center justify-between p-3 rounded-xl border border-slate-700 hover:border-emerald-400 bg-slate-800/70 transition"
                    >
                      <div className="text-left">
                        <div className="text-sm font-bold">{pkg.count}</div>
                        <div className="text-[11px] text-emerald-400">{pkg.tag}</div>
                      </div>
                      <div className="bg-emerald-500 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg">
                        {pkg.price}
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
