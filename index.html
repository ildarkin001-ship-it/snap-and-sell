<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Сфоткай — Продай</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    function App() {
      return (
        <div className="p-4 max-w-md mx-auto text-center space-y-4">
          <h1 className="text-xl font-bold text-emerald-400 mt-10">Сфоткай — Продай</h1>
          <p className="text-xs text-slate-300">Приложение успешно подключено к Telegram!</p>
          <div className="bg-slate-800 p-4 rounded-2xl border border-slate-700 text-xs text-left space-y-2">
            <p className="font-semibold text-white">✅ Всё работает!</p>
            <p className="text-slate-400">Интерфейс успешно загрузился внутри мессенджера.</p>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
